services:
  app:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/party-games.sqlite
      WEB_DIST_PATH: /app/apps/web/dist
      POKER_ENABLED: ${POKER_ENABLED:-true}
      MANOR_TIME_SCALE: ${MANOR_TIME_SCALE:-1}
      MANOR_TEST_TOOLS_ENABLED: ${MANOR_TEST_TOOLS_ENABLED:-false}
      PARTY_GAMES_LLM_ENABLED: ${PARTY_GAMES_LLM_ENABLED:-}
      PARTY_GAMES_LLM_ENDPOINT: ${PARTY_GAMES_LLM_ENDPOINT:-}
      PARTY_GAMES_LLM_API_KEY: ${PARTY_GAMES_LLM_API_KEY:-}
      PARTY_GAMES_LLM_MODEL: ${PARTY_GAMES_LLM_MODEL:-}
      PARTY_GAMES_LLM_STORY_MODEL: ${PARTY_GAMES_LLM_STORY_MODEL:-}
      PARTY_GAMES_LLM_JUDGE_MODEL: ${PARTY_GAMES_LLM_JUDGE_MODEL:-}
      PARTY_GAMES_LLM_TIMEOUT_MS: ${PARTY_GAMES_LLM_TIMEOUT_MS:-8000}
      CLOCKTOWER_LLM_ENABLED: ${CLOCKTOWER_LLM_ENABLED:-}
      CLOCKTOWER_LLM_ENDPOINT: ${CLOCKTOWER_LLM_ENDPOINT:-}
      CLOCKTOWER_LLM_API_KEY: ${CLOCKTOWER_LLM_API_KEY:-}
      CLOCKTOWER_LLM_MODEL: ${CLOCKTOWER_LLM_MODEL:-}
      CLOCKTOWER_LLM_TIMEOUT_MS: ${CLOCKTOWER_LLM_TIMEOUT_MS:-8000}
    ports:
      - "${PARTY_GAMES_PORT:-18081}:3000"
    volumes:
      - party-games-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  party-games-data:
