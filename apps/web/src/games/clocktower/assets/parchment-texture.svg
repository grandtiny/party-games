<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <defs>
    <!-- 主噪点：细密斑驳（做旧） -->
    <filter id="ct-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="11" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.12
                              0 0 0 0 0.07
                              0 0 0 0 0.16
                              0 0 0 0.6 0"/>
    </filter>
    <!-- 粗纤维：纸张长纹（极低频） -->
    <filter id="ct-fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.18" numOctaves="2" seed="5" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.18
                              0 0 0 0 0.10
                              0 0 0 0 0.05
                              0 0 0 0.25 0"/>
    </filter>
    <!-- 暗斑：随机磨损点（中频） -->
    <filter id="ct-stain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="6"/>
      <feColorMatrix values="0 0 0 0 0.08
                              0 0 0 0 0.04
                              0 0 0 0 0.02
                              0 0 0 0.4 0"/>
    </filter>
  </defs>
  <rect width="220" height="220" filter="url(#ct-grain)" opacity="0.55"/>
  <rect width="220" height="220" filter="url(#ct-fiber)" opacity="0.6"/>
</svg>
