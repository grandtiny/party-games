<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" stroke="#C9A84C">
  <!-- 外层圆环（双线） -->
  <circle cx="200" cy="200" r="195" stroke-width="2"/>
  <circle cx="200" cy="200" r="188" stroke-width="1"/>

  <!-- 外圈 12 等分符文刻度 -->
  <g stroke-width="1.5">
    <line x1="200" y1="8" x2="200" y2="22"/>
    <line x1="200" y1="8" x2="200" y2="22" transform="rotate(30 200 200)"/>
    <line x1="200" y1="8" x2="200" y2="22" transform="rotate(60 200 200)"/>
    <line x1="200" y1="8" x2="200" y2="22" transform="rotate(90 200 200)"/>
    <line x1="200" y1="8" x2="200" y2="22" transform="rotate(120 200 200)"/>
    <line x1="200" y1="8" x2="200" y2="22" transform="rotate(150 200 200)"/>
    <line x1="200" y1="8" x2="200" y2="22" transform="rotate(180 200 200)"/>
    <line x1="200" y1="8" x2="200" y2="22" transform="rotate(210 200 200)"/>
    <line x1="200" y1="8" x2="200" y2="22" transform="rotate(240 200 200)"/>
    <line x1="200" y1="8" x2="200" y2="22" transform="rotate(270 200 200)"/>
    <line x1="200" y1="8" x2="200" y2="22" transform="rotate(300 200 200)"/>
    <line x1="200" y1="8" x2="200" y2="22" transform="rotate(330 200 200)"/>
  </g>

  <!-- 中层圆环 -->
  <circle cx="200" cy="200" r="160" stroke-width="1"/>
  <circle cx="200" cy="200" r="155" stroke-width="0.8"/>

  <!-- 五角星（外接半径 150，朝上；外接圆中心 200,200，5 顶点距中心均为 150，径向完全对称） -->
  <polygon points="200,50 288.17,321.35 57.34,153.65 342.66,153.65 111.83,321.35" stroke-width="1.5"/>

  <!-- 五角星交叉点连成的内五边形（半径 57.3，与外星同心对称） -->
  <polygon points="233.67,153.63 254.51,217.71 200,257.3 145.49,217.71 166.33,153.63" stroke-width="0.8" opacity="0.7"/>

  <!-- 内层圆环（包裹五角星底部） -->
  <circle cx="200" cy="200" r="95" stroke-width="1"/>
  <circle cx="200" cy="200" r="90" stroke-width="0.8"/>

  <!-- 中心圆（小，包裹中心文字区） -->
  <circle cx="200" cy="200" r="55" stroke-width="0.8" opacity="0.6"/>

  <!-- 四方位菱形宝石 -->
  <g stroke-width="1">
    <polygon points="200,2 207,12 200,22 193,12"/>
    <polygon points="200,378 207,388 200,398 193,388"/>
    <polygon points="2,200 12,193 22,200 12,207"/>
    <polygon points="378,200 388,193 398,200 388,207"/>
  </g>

  <!-- 八方位小圆点装饰 -->
  <g fill="#C9A84C" stroke="none">
    <circle cx="200" cy="35" r="2.5"/>
    <circle cx="200" cy="365" r="2.5"/>
    <circle cx="35" cy="200" r="2.5"/>
    <circle cx="365" cy="200" r="2.5"/>
    <circle cx="84" cy="84" r="2"/>
    <circle cx="316" cy="84" r="2"/>
    <circle cx="84" cy="316" r="2"/>
    <circle cx="316" cy="316" r="2"/>
  </g>
</svg>
